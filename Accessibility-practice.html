<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout Page</title>
</head>
<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="image of an unsolved rubic's cube">
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
            <fieldset>
                <label for="card-name"><span aria-hidden="true">*</span>Name on card</label>
                <input id="card-name" name="card-name" type="text" required><br>
                <label for="card-number"><span aria-hidden="true">*</span>Number on card</label>
                <input type="text" id="card-number" name="card-number" required aria-describedby="card-number-help">
                <p id="card-number-help">card number must have 8 digits only numbers</p>
            </fieldset>
        </form>
    </section>
</body>
</html>

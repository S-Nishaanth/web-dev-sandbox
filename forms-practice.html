<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forms Playground</title>
</head>
<body>
    <main>
        <h1>Event Registration</h1>
        <form>
            <!-- Pair labels with inputs using matching 'for' and 'id' attributes -->
            <label for="username">Full Name:</label>
            <input type="text" size="2" minlength="4" maxlength="64" id="username" placeholder="Enter name">

            <label for="useremail">Email Address:</label>
            <input type="email" id="useremail" minlength="4" maxlength="64" required>

            <input id="yes-option" type="radio" name="came-first-time" value="yes" />
            <label for="yes-option">Yes</label>

            <input id="no-option" type="radio" name="came-before" value="no" />
            <label for="no-option">No</label>
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
